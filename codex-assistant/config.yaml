name: "Codex Assistant"
description: "Secure AI-assisted Home Assistant YAML editor"
version: "0.1.0"
slug: "codex_assistant"
url: "https://github.com/g4youu/ha-codex.git"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
panel_title: Codex Assistant
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - config:rw
  - addon_config:rw
options:
  log_level: info
  auth_token: ""
  openai_api_key: ""
  model: "gpt-5-mini"
  dry_run: true
  require_manual_approval: true
  approval_phrase: "APPLY"
  allow_dangerous_changes: false
  forbidden_tokens: "shell_command:,command_line:,python_script:,rest_command:,service: homeassistant.restart,service: hassio.host_reboot,service: hassio.host_shutdown,service: hassio.addon_start,service: hassio.addon_stop,service: hassio.addon_restart"
  max_apply_operations: 5
  max_diff_chars: 40000
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  auth_token: password?
  openai_api_key: password?
  model: str?
  dry_run: bool?
  require_manual_approval: bool?
  approval_phrase: str?
  allow_dangerous_changes: bool?
  forbidden_tokens: str?
  max_apply_operations: int(1,10)?
  max_diff_chars: int(500,200000)?
ports: {}
ports_description: {}
