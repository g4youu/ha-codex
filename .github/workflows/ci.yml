name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r codex-assistant/requirements.txt

      - name: Compile Python sources
        run: python -m compileall codex-assistant/src

      - name: Validate changelog JSON
        run: python -m json.tool codex-assistant/src/static/changelog.json > /dev/null

      - name: Check version consistency
        run: |
          ADDON_VERSION=$(grep -E '^version:' codex-assistant/config.yaml | head -n1 | sed -E 's/version:\s*"?([0-9.]+)"?/\1/')
          APP_VERSION=$(grep -E 'version="[0-9.]+' codex-assistant/src/main.py | head -n1 | sed -E 's/.*version="([0-9.]+)".*/\1/')
          echo "Addon version: ${ADDON_VERSION}"
          echo "App version:   ${APP_VERSION}"
          test "${ADDON_VERSION}" = "${APP_VERSION}"
